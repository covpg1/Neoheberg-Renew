name: Neoheberg Renew

on:
  schedule:
    - cron: "0 2 * * *"     # 每天 UTC 02:00 触发，真检查由下面的 14 天门禁控制（cron 写不出严格的 14 天间隔）
  workflow_dispatch:         # 可在 Actions 页面手动触发
    inputs:
      force_renew:
        description: "忽略剩余天数，强制续期"
        type: boolean
        default: false

permissions:
  contents: write            # 保活：提交 last_check.txt
  actions: write             # 保活：重新启用本 workflow

# 续期与状态检查共用同一个账号：排队依次执行，避免同时登录触发站点限流
concurrency:
  group: neoheberg
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 14 天门禁：每天触发、这里卡间隔。last_check.txt 是上次真检查的时间
      # （门禁跳过的运行不提交，不刷新锚点）。按 UTC 日期算间隔，恰好 14 天；
      # 间隔等于续期窗口（14 天），任何周期都必有一次检查落在窗口内，不会漏检。
      # 手动触发跳过门禁、立即真检查；文件缺失或日期解析失败时默认放行。
      - name: Gate (14-day interval)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_check=true" >> "$GITHUB_OUTPUT"
            echo "手动触发，跳过 14 天门禁"
            exit 0
          fi
          anchor_date=""
          if [ -f last_check.txt ]; then
            anchor_date=$(grep -m1 '^last_check:' last_check.txt | sed 's/^last_check: *//; s/ .*//')
          fi
          anchor_epoch=$(date -d "$anchor_date" -u +%s 2>/dev/null || echo 0)
          today_epoch=$(date -d "$(date -u +%F)" -u +%s)
          age_days=$(( (today_epoch - anchor_epoch) / 86400 ))
          if [ "$age_days" -ge 14 ]; then
            echo "run_check=true" >> "$GITHUB_OUTPUT"
            echo "距上次真检查 ${age_days} 天，执行检查"
          else
            echo "run_check=false" >> "$GITHUB_OUTPUT"
            echo "距上次真检查 ${age_days} 天，未满 14 天，跳过"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # 代理（可选，都不配置则直连），二选一：
      #   NODE_LINK    节点分享链接（vless/vmess/trojan/ss/hysteria2/tuic/socks5/http），经 sing-box 转成本地 SOCKS5
      #   PROXY_SERVER 现成的代理地址，如 http://user:pass@host:port 或 socks5://host:port
      # 两者都配时 NODE_LINK 优先。配置了代理但不可用时，本次任务会取消，不会直连。
      - name: Setup proxy
        if: steps.gate.outputs.run_check == 'true'
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          USER_PROXY: ${{ secrets.PROXY_SERVER }}
        run: python setup_proxy.py || echo "PROXY_FAILED=1" >> "$GITHUB_ENV"

      - name: Run renew script
        if: steps.gate.outputs.run_check == 'true'
        id: renew
        env:
          # 账号（必填）
          NEO_USER: ${{ secrets.NEO_USER }}
          NEO_PASSWORD: ${{ secrets.NEO_PASSWORD }}
          NEO_VMID: ${{ secrets.NEO_VMID }}
          FORCE_RENEW: ${{ inputs.force_renew }}
          # 可选参数（Variables 里设置，留空则用默认值）：RENEW_DAYS 默认 14
          RENEW_DAYS: ${{ vars.RENEW_DAYS }}
          # Telegram 推送（可选）：Secrets 里设置 TG_BOT_TOKEN / TG_CHAT_ID
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 推送策略（可选）：Variables 里设置 TG_NOTIFY = always(默认) / change / fail
          TG_NOTIFY: ${{ vars.TG_NOTIFY }}
          TG_ACCOUNT_LABEL: ${{ vars.TG_ACCOUNT_LABEL }}
        run: python renew.py

      # 启动阶段就失败（装依赖出错等）时 renew.py 来不及推送，这里兜底通知一次
      - name: Notify Telegram (failed before renew)
        if: failure() && steps.renew.outcome == 'skipped' && steps.gate.outputs.run_check == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] || exit 0
          curl -sS -m 20 -o /dev/null "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=❌ NeoHeberg 续期任务在启动阶段失败：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Upload debug files
        if: failure() && steps.gate.outputs.run_check == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            *.png
            *.html
          if-no-files-found: ignore

      # 仓库保活：每次真检查（无论成功失败）都把检测时间写入 last_check.txt 并提交，
      # 保证仓库每 14 天都有新提交，避免 GitHub 在 60 天无活动后停用定时任务。
      # 该时间同时是 14 天门禁的锚点：门禁跳过的运行不提交，不刷新锚点。
      - name: Keepalive (update last_check.txt)
        if: always() && steps.gate.outputs.run_check == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "last_check: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            echo "status: ${JOB_STATUS}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > last_check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_check.txt          # 只提交这一个文件，不会带上调试截图
          git commit -m "chore: update last_check [skip ci]"
          git pull --rebase --autostash || true
          git push || echo "push 失败（已忽略）：请检查 Settings → Actions → General → Workflow permissions 是否为 Read and write"
          gh workflow enable "${{ github.workflow }}" || true   # 额外保险，失败不影响结果
